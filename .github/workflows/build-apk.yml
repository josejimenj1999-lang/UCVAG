name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
- name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleProdDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-debug
          path: android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
